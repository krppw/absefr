<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>ABSEFR</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070707;
      --panel: #101010;
      --panel-2: #151515;
      --line: #292929;
      --muted: #858585;
      --text: #f4f4f4;
      --accent: #d8ff3e;
      --accent-hover: #bce61a;
      --green: #48df91;
      --red: #ff6262;
      --card-bg-start: #151515;
      --card-bg-end: #0d0d0d;
      --card-border: #303030;
      --btn-bg: #202020;
      --btn-border: #414141;
      --btn-text: #eee;
      --status-bg: #0a0a0a;
      --status-border: #343434;
      --status-text: #aaa;
      --social-bg: #111;
      --social-border: #292929;
      --social-text: #aaa;
      --social-hover-bg: #171a0d;
      --social-hover-border: #68752c;
      --version-bg: rgba(0,0,0,.28);
      --header-border: rgba(255,255,255,.08);
      --bg-grid: rgba(255,255,255,.018);
      --bg-radial: rgba(216,255,62,.09);
      --snowflake-color: rgba(255, 255, 255, 0.75);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f0f2f5;
      --line: #e1e4e8;
      --muted: #666666;
      --text: #111111;
      --accent: #7fa400;
      --accent-hover: #678500;
      --green: #10b981;
      --red: #ef4444;
      --card-bg-start: #ffffff;
      --card-bg-end: #f8fafc;
      --card-border: #e2e8f0;
      --btn-bg: #ffffff;
      --btn-border: #cbd5e1;
      --btn-text: #1e293b;
      --status-bg: #f1f5f9;
      --status-border: #cbd5e1;
      --status-text: #475569;
      --social-bg: #ffffff;
      --social-border: #cbd5e1;
      --social-text: #475569;
      --social-hover-bg: #f7fee7;
      --social-hover-border: #84cc16;
      --version-bg: rgba(0,0,0,.04);
      --header-border: rgba(0,0,0,.08);
      --bg-grid: rgba(0,0,0,.03);
      --bg-radial: rgba(127,164,0,.12);
      --snowflake-color: rgba(50, 80, 110, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, var(--bg-radial), transparent 36%),
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 42px 42px, 42px 42px, auto;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color .3s ease, color .3s ease;
      position: relative;
    }

    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .wrap { width: min(100% - 40px, 1000px); margin: 0 auto; position: relative; z-index: 2; }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--header-border);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      color: var(--text);
      text-decoration: none;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .brand span { color: var(--accent); }

    .edition {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-right: 6px;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all .18s ease;
    }
    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    .icon-btn.off {
      opacity: 0.4;
    }
    .icon-btn.off:hover {
      opacity: 0.8;
    }

    main { padding: 82px 0 70px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      margin: 18px 0 38px;
      font-size: clamp(48px, 10vw, 86px);
      line-height: .95;
      letter-spacing: -5px;
      font-weight: 900;
    }
    h1 span { color: var(--accent); }

    .server-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 28px;
      padding: 30px;
      background: linear-gradient(125deg, var(--card-bg-start), var(--card-bg-end) 70%);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.15);
      transition: all .3s ease;
    }
    .server-card::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: 110px;
      top: -170px;
      border: 1px solid var(--accent);
      opacity: 0.2;
      transform: rotate(45deg);
      pointer-events: none;
    }

    .label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .ip-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 13px;
    }
    .ip {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: -.8px;
      user-select: text;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn:active { transform: scale(.97); }
    .copy-btn svg { width: 16px; height: 16px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 20px;
      padding: 9px 12px;
      border: 1px solid var(--status-border);
      border-radius: 8px;
      background: var(--status-bg);
      color: var(--status-text);
      font-size: 12px;
      font-weight: 650;
      transition: all .3s ease;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
    }
    .status.online { color: var(--green); border-color: rgba(16, 185, 129, 0.4); }
    .status.online .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .status.offline { color: var(--red); border-color: rgba(239, 68, 68, 0.4); }
    .status.offline .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }

    .version-box {
      position: relative;
      z-index: 1;
      min-width: 145px;
      padding: 18px;
      border: 1px solid var(--card-border);
      border-radius: 13px;
      background: var(--version-bg);
      text-align: center;
      transition: all .3s ease;
    }
    .version-box strong {
      display: block;
      margin-top: 7px;
      font-size: 22px;
      letter-spacing: -.5px;
    }
    .version-box span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .lower {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 26px;
    }
    .social-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .socials { display: flex; gap: 10px; }
    .socials a {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      color: var(--social-text);
      background: var(--social-bg);
      border: 1px solid var(--social-border);
      border-radius: 12px;
      transition: .18s ease;
    }
    .socials a:hover {
      color: var(--accent);
      border-color: var(--social-hover-border);
      background: var(--social-hover-bg);
      transform: translateY(-2px);
    }
    .socials svg { width: 20px; height: 20px; }

    footer {
      padding: 22px 0 28px;
      border-top: 1px solid var(--header-border);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 620px) {
      .wrap { width: min(100% - 28px, 1000px); }
      header { height: 66px; }
      main { padding: 64px 0 56px; }
      h1 { letter-spacing: -3px; margin-bottom: 30px; }
      .server-card { grid-template-columns: 1fr; padding: 23px 19px; gap: 22px; }
      .version-box { display: flex; align-items: center; justify-content: space-between; text-align: left; }
      .version-box strong { margin: 0; }
      .lower { align-items: flex-start; flex-direction: column; }
      .edition { font-size: 9px; letter-spacing: 1px; display: none; }
    }
  </style>
</head>
<body>
  <canvas id="snow-canvas"></canvas>

  <header class="wrap">
    <a class="brand" href="#">ABSEFR<span>.</span></a>
    <div class="header-right">
      <div class="edition">Minecraft Java Edition</div>
      
      <button class="icon-btn" id="snow-toggle" type="button" aria-label="Переключить снег" title="Переключить снег">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5l-5 5-5-5M17 19l-5-5-5 5M2 12h20M5 7l5 5-5 5M19 7l-5 5 5 5"/>
        </svg>
      </button>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему">
        <svg id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div class="eyebrow">Minecraft server</div>
    <h1>ABSEFR<span>•</span></h1>

    <section class="server-card" aria-label="Информация о сервере">
      <div>
        <div class="label">Адрес сервера</div>
        <div class="ip-row">
          <div class="ip" id="server-ip">play.absefr.ru</div>
          <button class="copy-btn" id="copy-btn" type="button" onclick="copyIP()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="2"/>
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
            </svg>
            <span id="copy-label">Копировать IP</span>
          </button>
        </div>
        <div class="status" id="server-status" role="status" aria-live="polite">
          <span class="dot"></span>
          <span id="status-text">- Соединение…</span>
        </div>
      </div>

      <div class="version-box">
        <span>VERSION</span>
        <strong>1.21.11</strong>
      </div>
    </section>

    <div class="lower">
      <div class="social-title">ССЫЛКИ</div>
      <nav class="socials" aria-label="Социальные сети">
        <a href="https://t.me/absefr" aria-label="Telegram" title="Telegram">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21.7 4.4 18.6 19c-.23 1.03-.84 1.28-1.7.8l-4.7-3.46-2.27 2.18c-.25.25-.46.46-.94.46l.34-4.78 8.7-7.86c.38-.34-.08-.53-.59-.19L6.69 13.1 2.06 11.65c-1-.31-1.02-1 .21-1.48L20.38 3.1c.84-.31 1.58.2 1.32 1.3Z"/>
          </svg>
        </a>
        <a href="https://discord.gg/Fu79hnDb8r" aria-label="Discord" title="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.7 5.3A18.3 18.3 0 0 0 15.2 4l-.55 1.12a16.8 16.8 0 0 0-5.3 0L8.8 4a18.3 18.3 0 0 0-4.5 1.3C1.45 9.5.68 13.6 1.06 17.65a18.4 18.4 0 0 0 5.5 2.78l1.18-1.92c-.65-.24-1.27-.54-1.85-.9l.45-.35c3.56 1.65 7.42 1.65 10.94 0l.46.35c-.59.36-1.21.66-1.86.9l1.18 1.92a18.4 18.4 0 0 0 5.5-2.78c.45-4.7-.77-8.75-3.86-12.35ZM8.8 14.9c-1.07 0-1.95-.98-1.95-2.18s.86-2.18 1.95-2.18 1.97.98 1.95 2.18c0 1.2-.86 2.18-1.95 2.18Zm6.4 0c-1.07 0-1.95-.98-1.95-2.18s.86-2.18 1.95-2.18 1.97.98 1.95 2.18c0 1.2-.86 2.18-1.95 2.18Z"/>
          </svg>
        </a>
        <a href="https://drive.google.com/file/d/1QRhwrGDATMbZY4agMPi30hajbYi_vLHr/view?usp=drivesdk" aria-label="Google" title="Google">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/>
            <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/>
            <path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 17.9l6.8-5.2Z"/>
            <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z"/>
          </svg>
        </a>
      </nav>
    </div>
  </main>

  <footer class="wrap">ABSEFR · 2026</footer>

  <script>
    // Theme toggle
    const themeToggleBtn = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const metaThemeColor = document.querySelector('meta[name="theme-color"]');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      
      if (theme === 'dark') {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#070707');
      } else {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
        if (metaThemeColor) metaThemeColor.setAttribute('content', '#f5f6f8');
      }
    }

    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    if (savedTheme) {
      setTheme(savedTheme);
    } else {
      setTheme(prefersDark ? 'dark' : 'light');
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Snow animation logic
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    const snowToggleBtn = document.getElementById('snow-toggle');
    
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    let flakes = [];
    let animationFrameId = null;
    let snowEnabled = localStorage.getItem('snow') !== 'disabled';

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    function createFlakes() {
      const flakeCount = Math.floor((width * height) / 15000);
      flakes = [];
      for (let i = 0; i < flakeCount; i++) {
        flakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.5 + 1,
          d: Math.random() * 1 + 0.5,
          step: Math.random() * 0.05,
          stepSize: Math.random() * 0.02
        });
      }
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      const colorStyle = getComputedStyle(document.documentElement).getPropertyValue('--snowflake-color').trim();
      ctx.fillStyle = colorStyle || 'rgba(255, 255, 255, 0.7)';

      for (let i = 0; i < flakes.length; i++) {
        const f = flakes[i];
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
        ctx.fill();

        f.y += Math.cos(f.d) + 1 + f.r / 2;
        f.step += f.stepSize;
        f.x += Math.sin(f.step) * 1;

        if (f.y > height) {
          flakes[i] = {
            x: Math.random() * width,
            y: -10,
            r: f.r,
            d: f.d,
            step: f.step,
            stepSize: f.stepSize
          };
        }
      }
      animationFrameId = requestAnimationFrame(drawSnow);
    }

    function toggleSnow(enable) {
      snowEnabled = enable;
      localStorage.setItem('snow', enable ? 'enabled' : 'disabled');
      if (enable) {
        snowToggleBtn.classList.remove('off');
        canvas.style.display = 'block';
        if (!animationFrameId) {
          createFlakes();
          drawSnow();
        }
      } else {
        snowToggleBtn.classList.add('off');
        canvas.style.display = 'none';
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      }
    }

    snowToggleBtn.addEventListener('click', () => {
      toggleSnow(!snowEnabled);
    });

    toggleSnow(snowEnabled);

    // Server status logic
    const statusBox = document.getElementById("server-status");
    const statusText = document.getElementById("status-text");

    async function updateServerStatus() {
      try {
        const response = await fetch("https://api.mcsrvstat.us/3/play.absefr.ru", { cache: "no-store" });
        if (!response.ok) throw new Error("Status request failed");
        const data = await response.json();

        statusBox.classList.remove("online", "offline");
        if (data.online) {
          statusBox.classList.add("online");
          statusText.textContent = "Онлайн";
        } else {
          statusBox.classList.add("offline");
          statusText.textContent = "Оффлайн";
        }
      } catch {
        statusBox.classList.remove("online", "offline");
        statusText.textContent = "Соединение...";
      }
    }

    async function copyIP() {
      const label = document.getElementById("copy-label");
      try {
        await navigator.clipboard.writeText("play.absefr.ru");
        label.textContent = "Скопировано!";
      } catch {
        const field = document.createElement("textarea");
        field.value = "play.absefr.ru";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        label.textContent = copied ? "Скопировано!" : "Скопируйте вручную";
      }
      setTimeout(() => label.textContent = "Копировать IP", 1800);
    }

    updateServerStatus();
    setInterval(updateServerStatus, 60000);
  </script>
</body>
</html>
